# nginx/nginx.conf  (production v2)
# ----------------------------------
# Changes from v1:
#   ✓ 3 coordinator upstreams with least_conn load balancing
#   ✓ HTTPS on port 443 with TLS 1.2/1.3 only
#   ✓ HTTP → HTTPS redirect on port 80
#   ✓ Rate limiting: 30 req/s per IP for resolve, 5 req/s for shorten
#   ✓ Gzip compression for JSON responses
#   ✓ Security headers (HSTS, X-Frame-Options, CSP)
#   ✓ /admin/* blocked at nginx level (only reachable from internal network)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time s "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ── gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 256;

    # ── rate limiting ─────────────────────────────────────────────────────────
    # 30 req/s per IP for URL resolution (generous — most are cached at coordinator)
    limit_req_zone $binary_remote_addr zone=resolve_limit:10m rate=30r/s;
    # 5 req/s per IP for URL creation
    limit_req_zone $binary_remote_addr zone=shorten_limit:10m rate=5r/s;

    # ── upstream: 3 coordinator replicas ─────────────────────────────────────
    upstream coordinators {
        least_conn;
        server coordinator-1:5000 max_fails=3 fail_timeout=10s;
        server coordinator-2:5000 max_fails=3 fail_timeout=10s;
        server coordinator-3:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── upstream: React/TypeScript frontend (static build served via nginx) ──
    upstream frontend {
        server frontend:80;
    }

    # ── HTTP server (direct, no redirect for local dev) ───────────────────────
    server {
        listen 80;
        server_name _;

        location /admin {
            return 403 '{"error":"Admin endpoints not accessible via public gateway"}';
            add_header Content-Type application/json always;
        }

        # ── React/TypeScript frontend: index page + built assets ────────────
        location = / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
        }

        location /assets/ {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
        }

        location /shorten {
            limit_req zone=shorten_limit burst=10 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }

        location /api/ {
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location / {
            limit_req zone=resolve_limit burst=60 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                   always;
        add_header X-Content-Type-Options    nosniff                                always;
        add_header Referrer-Policy           "no-referrer"                          always;

        # ── block /admin from public internet ────────────────────────────────
        location /admin {
            return 403 '{"error":"Admin endpoints not accessible via public gateway"}';
            add_header Content-Type application/json always;
        }

        # ── React/TypeScript frontend: index page + built assets ────────────
        location = / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── URL resolution (high traffic, cached) ─────────────────────────────
        # Note: nginx treats {n,m} as variables in regex locations.
        # Using ~* with \d equivalent avoided; plain location / handles this below.

        # ── URL shortening (write path) ───────────────────────────────────────
        location /shorten {
            limit_req zone=shorten_limit burst=10 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        location /api/ {
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── everything else: short URL resolution, health, info, dashboard ──────
        location / {
            limit_req zone=resolve_limit burst=60 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}