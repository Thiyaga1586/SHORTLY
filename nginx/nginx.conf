# nginx/nginx.conf  (production v2)
# ----------------------------------
# Changes from v1:
#   ✓ 3 coordinator upstreams with least_conn load balancing
#   ✓ HTTPS on port 443 with TLS 1.2/1.3 only
#   ✓ Rate limiting: 30 req/s per IP for resolve, 5 req/s for shorten
#   ✓ Gzip compression for JSON responses
#   ✓ Security headers (HSTS, X-Frame-Options, CSP)
#   ✓ /admin/* blocked at nginx level (only reachable from internal network)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Docker service IPs can change whenever a container is recreated. Use the
    # embedded Docker DNS resolver so nginx refreshes upstream addresses at
    # runtime instead of pinning the IP resolved when nginx first started.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time s "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── trusted client IP restoration ────────────────────────────────────────
    # Only Cloudflare edge addresses may supply CF-Connecting-IP. Requests
    # reaching the origin from any other source cannot spoof the address used
    # for logs and nginx rate limiting. Keep these ranges in sync with:
    # https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ── gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 256;

    # ── rate limiting ─────────────────────────────────────────────────────────
    # 30 req/s per IP for URL resolution (generous — most are cached at coordinator)
    limit_req_zone $binary_remote_addr zone=resolve_limit:10m rate=30r/s;
    # 5 req/s per IP for URL creation
    limit_req_zone $binary_remote_addr zone=shorten_limit:10m rate=5r/s;
    limit_req_status 429;

    # ── upstream: 3 coordinator replicas ─────────────────────────────────────
    upstream coordinators {
        zone coordinators 64k;
        least_conn;
        server coordinator-1:5000 resolve max_fails=3 fail_timeout=10s;
        server coordinator-2:5000 resolve max_fails=3 fail_timeout=10s;
        server coordinator-3:5000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── upstream: React/TypeScript frontend (static build served via nginx) ──
    upstream frontend {
        zone frontend 32k;
        server frontend:80 resolve;
    }

    # ── HTTP server (loopback-only by default in docker-compose) ─────────────
    server {
        listen 80;
        server_name _;

        location /admin {
            return 403 '{"error":"Admin endpoints not accessible via public gateway"}';
            add_header Content-Type application/json always;
        }

        # Prometheus scrapes coordinator metrics over the internal Docker
        # network. Do not publish process/runtime metrics through the gateway.
        location = /metrics {
            return 404;
        }

        # ── React/TypeScript frontend: index page + built assets ────────────
        location = / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
        }

        location /assets/ {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
        }

        location /shorten {
            limit_req zone=shorten_limit burst=10 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        location /api/ {
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location / {
            limit_req zone=resolve_limit burst=60 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                   always;
        add_header X-Content-Type-Options    nosniff                                always;
        add_header Referrer-Policy           "no-referrer"                          always;
        add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

        # ── block /admin from public internet ────────────────────────────────
        location /admin {
            return 403 '{"error":"Admin endpoints not accessible via public gateway"}';
            add_header Content-Type application/json always;
        }

        location = /metrics {
            return 404;
        }

        # ── React/TypeScript frontend: index page + built assets ────────────
        location = / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            proxy_pass         http://frontend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── URL resolution (high traffic, cached) ─────────────────────────────
        # Note: nginx treats {n,m} as variables in regex locations.
        # Using ~* with \d equivalent avoided; plain location / handles this below.

        # ── URL shortening (write path) ───────────────────────────────────────
        location /shorten {
            limit_req zone=shorten_limit burst=10 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        location /api/ {
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── everything else: short URL resolution, health, info, dashboard ──────
        location / {
            limit_req zone=resolve_limit burst=60 nodelay;
            proxy_pass         http://coordinators;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
