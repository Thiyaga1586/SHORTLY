
# Shortly Distributed — Production Stack
# ----------------------------------------
# Topology:
#
#   [Client]
#      │  HTTPS :443
#   [nginx]  ←── rate limiting, TLS termination, /admin blocked
#      │  least_conn
#   [coordinator-1] [coordinator-2] [coordinator-3]  ← 3 replicas
#      │  all share ring + cache via Redis
#   [Redis]  ←── ring state (shortly:ring:*) + cache (shortly:url:*)
#      │
#   [node-1] [node-2] [node-3]   ← storage nodes
#      │
#   [postgres]   ← one DB per node (shortly_node_1/2/3)

x-coordinator-base: &coordinator-base
  build:
    context: .
    dockerfile: coordinator/Dockerfile
  environment:
    CACHE_SIZE:           "${CACHE_SIZE:-2000}"
    CACHE_TTL:            "${CACHE_TTL:-300}"
    VNODES_PER_NODE:      "${VNODES_PER_NODE:-150}"
    REDIS_URL:            "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
    ADMIN_API_KEYS:       "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}"
    PUBLIC_BASE_URL:      "${PUBLIC_BASE_URL:-https://localhost:9443}"
    PORT:                 "5000"
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - shortly-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-m", "coordinator.health"]
    interval: 10s
    timeout: 5s
    retries: 3

x-node-base: &node-base
  build:
    context: .
    dockerfile: node/Dockerfile
  depends_on:
    db-init:
      condition: service_completed_successfully
  networks:
    - shortly-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-m", "node.health"]
    interval: 10s
    timeout: 5s
    retries: 3

services:

  # ── infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: shortly-postgres
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB:       postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shortly-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Create the least-privilege application role, the three default logical
  # databases, and the optional scale-profile database after Postgres is
  # healthy. Credentials come from .env; no password is stored in checked-in SQL.
  db-init:
    image: postgres:16-alpine
    container_name: shortly-db-init
    user: postgres
    environment:
      PGPASSWORD:          "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SHORTLY_DB_PASSWORD: "${SHORTLY_DB_PASSWORD:?Set SHORTLY_DB_PASSWORD in .env}"
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d postgres <<'SQL'
        \getenv app_password SHORTLY_DB_PASSWORD
        SELECT format('CREATE ROLE shortly LOGIN PASSWORD %L', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'shortly')
        \gexec
        ALTER ROLE shortly WITH LOGIN PASSWORD :'app_password';
        SELECT 'CREATE DATABASE shortly_node_1 OWNER shortly'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'shortly_node_1')
        \gexec
        SELECT 'CREATE DATABASE shortly_node_2 OWNER shortly'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'shortly_node_2')
        \gexec
        SELECT 'CREATE DATABASE shortly_node_3 OWNER shortly'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'shortly_node_3')
        \gexec
        -- Optional fourth shard for the add/remove-node migration demo.
        SELECT 'CREATE DATABASE shortly_node_4 OWNER shortly'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'shortly_node_4')
        \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shortly-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: shortly-redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    # Keep redis-server as argv[0] so the official entrypoint can repair volume
    # ownership when upgrading an older root-owned volume, then drop to redis.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - shortly-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(printenv REDIS_PASSWORD) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── coordinators (3 replicas) ─────────────────────────────────────────────

  coordinator-1:
    <<: *coordinator-base
    container_name: shortly-coordinator-1
    ports:
      - "127.0.0.1:5001:5000"   # local-only admin/bootstrap access

  coordinator-2:
    <<: *coordinator-base
    container_name: shortly-coordinator-2
    ports:
      - "127.0.0.1:5002:5000"

  coordinator-3:
    <<: *coordinator-base
    container_name: shortly-coordinator-3
    ports:
      - "127.0.0.1:5003:5000"

  # ── storage nodes ─────────────────────────────────────────────────────────

  node-1:
    <<: *node-base
    container_name: shortly-node-1
    environment:
      ADMIN_API_KEYS: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}"
      NODE_ID:      "node-1"
      PORT:         "5001"
      DATABASE_URL: "postgresql://shortly:${SHORTLY_DB_PASSWORD:?Set SHORTLY_DB_PASSWORD in .env}@postgres:5432/shortly_node_1"
      DB_POOL_MIN:  "2"
      DB_POOL_MAX:  "3"

  node-2:
    <<: *node-base
    container_name: shortly-node-2
    environment:
      ADMIN_API_KEYS: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}"
      NODE_ID:      "node-2"
      PORT:         "5002"
      DATABASE_URL: "postgresql://shortly:${SHORTLY_DB_PASSWORD:?Set SHORTLY_DB_PASSWORD in .env}@postgres:5432/shortly_node_2"
      DB_POOL_MIN:  "2"
      DB_POOL_MAX:  "3"

  node-3:
    <<: *node-base
    container_name: shortly-node-3
    environment:
      ADMIN_API_KEYS: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}"
      NODE_ID:      "node-3"
      PORT:         "5003"
      DATABASE_URL: "postgresql://shortly:${SHORTLY_DB_PASSWORD:?Set SHORTLY_DB_PASSWORD in .env}@postgres:5432/shortly_node_3"
      DB_POOL_MIN:  "2"
      DB_POOL_MAX:  "3"

  # Start explicitly with `docker compose --profile scale up -d node-4`.
  # Register through the authenticated coordinator only after node-4 is healthy.
  node-4:
    <<: *node-base
    profiles: [scale]
    container_name: shortly-node-4
    environment:
      ADMIN_API_KEYS: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}"
      NODE_ID:      "node-4"
      PORT:         "5004"
      DATABASE_URL: "postgresql://shortly:${SHORTLY_DB_PASSWORD:?Set SHORTLY_DB_PASSWORD in .env}@postgres:5432/shortly_node_4"
      DB_POOL_MIN:  "2"
      DB_POOL_MAX:  "3"

  # ── frontend (React + TypeScript, built and served via nginx) ────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shortly-frontend
    networks:
      - shortly-net
    restart: unless-stopped

  # ── nginx (public gateway) ────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: shortly-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      # Loopback binding keeps the origin private for the default Cloudflare
      # Tunnel deployment. Set NGINX_BIND_ADDRESS deliberately for direct ingress.
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8888}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-9443}:443"
    depends_on:
      - coordinator-1
      - coordinator-2
      - coordinator-3
      - frontend
    networks:
      - shortly-net
    restart: unless-stopped

networks:
  shortly-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
