[databases]
; Each storage node gets its own logical database.
; pgBouncer sits between node apps and Postgres and pools connections.
shortly_node_1 = host=postgres port=5432 dbname=shortly_node_1
shortly_node_2 = host=postgres port=5432 dbname=shortly_node_2
shortly_node_3 = host=postgres port=5432 dbname=shortly_node_3

[pgbouncer]
listen_addr         = *
listen_port         = 6432
auth_type           = scram-sha-256
auth_file           = /etc/pgbouncer/userlist.txt

; transaction mode: connection returned to pool after each transaction.
; This is the sweet spot for Flask/Gunicorn â€” stateless per-request pattern.
pool_mode           = transaction

; Max total connections PgBouncer will open to Postgres across all pools.
max_client_conn     = 500

; Per-database pool size (connections actually held open to Postgres)
default_pool_size   = 25

; Spare connections beyond default_pool_size available in bursts
reserve_pool_size   = 5
reserve_pool_timeout = 3.0

; Drop idle server connections after 600 s
server_idle_timeout = 600

; Log settings
log_connections     = 0
log_disconnections  = 0
log_pooler_errors   = 1

; Stats exposed at port 6432 (psql -h localhost -p 6432 pgbouncer)
stats_users         = shortly
